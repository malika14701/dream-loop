<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dream Loop</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="blocker"></div>
  <div id="ui-overlay" style="display:none">
    <div id="hud">
      <div id="night-display">NIGHT 1</div>
      <div id="flashlight-indicator">FLASHLIGHT ON</div>
    </div>
    <div id="anomaly-prompt">
      <p>Have you found an anomaly?</p>
      <button id="btn-found">I FOUND AN ANOMALY</button>
      <button id="btn-nothing">I FOUND NOTHING</button>
    </div>
    <div id="anomaly-feedback"></div>
  </div>
  <div id="pause-menu" style="display:none">
    <h2>PAUSED</h2>
    <button class="pause-btn" id="resumeBtn">RESUME</button>
    <button class="pause-btn" id="pauseSettingsBtn">SETTINGS</button>
    <button class="pause-btn" id="quitBtn">QUIT</button>
  </div>
  <div id="settings-panel" style="display:none">
    <h2>SETTINGS</h2>
    <label>Mouse Sensitivity: <input type="range" id="sensitivity" min="0.1" max="2" step="0.1" value="1" /></label>
    <label>Volume: <input type="range" id="volume" min="0" max="1" step="0.1" value="0.7" /></label>
    <label>Bloom: <input type="checkbox" id="bloom-toggle" checked /></label>
    <button class="pause-btn" id="settingsBackBtn">BACK</button>
  </div>
  <div id="night-transition" style="display:none">
    <div id="night-text">NIGHT 1</div>
    <div id="night-subtext"></div>
  </div>
  <div id="ending-screen" style="display:none">
    <h2>WAKE UP</h2>
    <p id="ending-text"></p>
    <button id="ending-restart">START AGAIN</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dream Loop</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="blocker">
    <div id="info">
      <h1>Dream Loop</h1>
      <p class="subtitle">A Psychological Horror Experience</p>
      <button id="startBtn">BEGIN</button>
      <button id="settingsBtn">SETTINGS</button>
      <p class="hint">Click to begin. WASD to move. Mouse to look. Shift to sprint. E to interact. F to toggle flashlight.</p>
    </div>
  </div>
  <div id="ui-overlay" style="display:none">
    <div id="hud">
      <div id="night-display">NIGHT 1</div>
      <div id="flashlight-indicator">🔦 ON</div>
      <div id="sprint-meter"></div>
    </div>
    <div id="interaction-hint"></div>
    <div id="anomaly-prompt">
      <p>Have you found an anomaly?</p>
      <button id="btn-found">I FOUND AN ANOMALY</button>
      <button id="btn-nothing">I FOUND NOTHING</button>
    </div>
    <div id="anomaly-feedback"></div>
  </div>
  <div id="pause-menu" style="display:none">
    <h2>PAUSED</h2>
    <button id="resumeBtn">RESUME</button>
    <button id="pauseSettingsBtn">SETTINGS</button>
    <button id="quitBtn">QUIT</button>
  </div>
  <div id="settings-panel" style="display:none">
    <h2>SETTINGS</h2>
    <label>Mouse Sensitivity: <input type="range" id="sensitivity" min="0.1" max="2" step="0.1" value="1" /></label>
    <label>Volume: <input type="range" id="volume" min="0" max="1" step="0.1" value="0.7" /></label>
    <label>Bloom: <input type="checkbox" id="bloom-toggle" checked /></label>
    <button id="settingsBackBtn">BACK</button>
  </div>
  <div id="night-transition" style="display:none">
    <div id="night-text">NIGHT 1</div>
    <div id="night-subtext"></div>
  </div>
  <div id="ending-screen" style="display:none">
    <h2>WAKE UP</h2>
    <p id="ending-text"></p>
    <button id="ending-restart">START AGAIN</button>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
